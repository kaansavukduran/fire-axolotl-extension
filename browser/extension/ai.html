<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aion · Local AI</title><link rel="stylesheet" href="ui.css"><script src="shared.js" defer></script><script src="ui.js" defer></script><script src="ai.js" defer></script></head>
<body class="settings"><header><img class="logo" src="icons/96.png" alt="Aion"><div><p class="eyebrow">AION · LOCAL AI</p><h1 data-i18n="localAI"></h1><p data-i18n="aiLocalHelp"></p></div></header><main class="settings-grid">
<section class="wide"><h2 data-i18n="aiModelTitle"></h2><p data-i18n="aiModelSize"></p><label><span data-i18n="aiModelChoice"></span><select id="aiModel"><option value="m2m">M2M100 · 418M</option><option value="qwen">Qwen 2.5 · 1.5B</option></select></label><p data-i18n="aiM2MHelp"></p><label><span data-i18n="aiBackend"></span><select id="aiBackend" data-setting="aiBackend"><option value="wasm" data-i18n="aiCPU"></option><option value="webgpu">WebGPU · shader-f16</option></select></label><p data-i18n="aiBackendHelp"></p><div class="row"><button id="model-download" data-i18n="aiDownload"></button><button id="model-load" class="secondary" data-i18n="aiLoadCached"></button><button id="model-cancel" class="secondary" data-i18n="aiCancel"></button><button id="model-unload" class="secondary" data-i18n="aiUnload"></button></div><p id="ai-state" role="status" aria-live="polite"></p><progress id="model-progress" hidden></progress><p id="model-bytes"></p><details><summary data-i18n="aiOfflineImport"></summary><p data-i18n="aiImportHelp"></p><input id="model-files" type="file" multiple accept=".json,.onnx" data-label="aiOfflineImport"><button id="model-import" class="secondary" data-i18n="aiImport"></button><button id="model-delete" class="secondary" data-i18n="aiDelete"></button><pre id="ai-detail"></pre></details></section>
<section class="wide"><h2 data-i18n="aiTranslation"></h2><div class="row"><label class="grow"><span data-i18n="sourceLanguage"></span><select id="aiSource" data-setting="aiSource"><option value="auto" data-i18n="autoDetect"></option></select></label><label class="grow"><span data-i18n="targetLanguage"></span><select id="aiTarget" data-setting="aiTarget"></select></label></div><label><span data-i18n="sourceText"></span><textarea id="ai-text" maxlength="4000" rows="3"></textarea></label><button id="ai-translate" data-i18n="aiTranslate"></button><label><span data-i18n="translationResult"></span><textarea id="ai-result" rows="4" readonly></textarea></label><details><summary data-i18n="aiGeneral"></summary><p data-i18n="aiGeneralHelp"></p><label><span data-i18n="aiPrompt"></span><textarea id="ai-prompt" rows="3" maxlength="4000"></textarea></label><button id="ai-generate" data-i18n="aiGenerate"></button><pre id="ai-answer"></pre></details></section>
<section class="wide"><h2 data-i18n="aiVideoTitle"></h2><p data-i18n="aiVideoHelp"></p><label><span data-i18n="targetTab"></span><select id="video-tab"></select></label><button id="video-refresh" class="secondary" data-i18n="refreshTabs"></button><label><span data-i18n="captionTrack"></span><select id="caption-track"><option value="auto" data-i18n="autoDetect"></option></select></label><label class="toggle"><input id="live-mode" type="checkbox"><span data-i18n="aiLiveMode"></span></label><p id="video-state" role="status" aria-live="polite"></p><p data-i18n="aiLiveLimit"></p><label><span data-i18n="originalSubtitle"></span><input id="subtitle-file" type="file" accept=".vtt,.srt,text/vtt"></label><div class="row"><button id="translate-file" data-i18n="aiTranslateFile"></button><button id="stop-video" class="secondary" data-i18n="aiStopVideo"></button><a id="subtitle-download" download="aion-translated.vtt" hidden data-i18n="aiDownloadVTT"></a></div><progress id="subtitle-progress" hidden></progress><p id="subtitle-count"></p><p id="live-source"></p><p id="live-translation"></p></section>
<section class="wide"><h2 data-i18n="captionAppearance"></h2><div class="row"><label class="grow"><span data-i18n="captionSize"></span><input id="captionSize" type="range" min="16" max="48" step="1" data-setting="captionSize"><output id="captionSize-value"></output> px</label><label class="grow"><span data-i18n="captionOpacity"></span><input id="captionOpacity" type="range" min="0" max="100" step="5" data-setting="captionOpacity"><output id="captionOpacity-value"></output> %</label></div><label><span data-i18n="font"></span><select id="captionFont" data-setting="captionFont"><option value="system" data-i18n="systemFont"></option><option value="lexend">Lexend</option><option value="opendyslexic" data-i18n="dyslexicCaption"></option></select></label><div class="row"><label><span data-i18n="captionColor"></span><input type="color" id="captionColor" data-setting="captionColor"></label><label><span data-i18n="captionTranslationColor"></span><input type="color" id="captionTranslationColor" data-setting="captionTranslationColor"></label><label><span data-i18n="captionPosition"></span><select id="captionPosition" data-setting="captionPosition"><option value="bottom" data-i18n="bottom"></option><option value="top" data-i18n="top"></option></select></label></div><label class="toggle"><input type="checkbox" data-setting="captionOriginal"><span data-i18n="showOriginal"></span></label><label class="toggle"><input type="checkbox" data-setting="captionTranslated"><span data-i18n="showTranslation"></span></label><div id="caption-preview" class="preview"><p>I was about to give up.</p><p>Tam vazgeçmek üzereydim.</p></div></section>
<p id="status" class="wide" role="status" aria-live="polite"></p></main><footer><button id="settings" class="secondary" data-i18n="settings"></button></footer></body></html>
