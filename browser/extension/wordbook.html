<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aion · Kelime defteri</title><link rel="stylesheet" href="ui.css"><script src="shared.js" defer></script><script src="ui.js" defer></script><script src="wordbook.js" defer></script></head>
<body class="settings wordbook" inert aria-busy="true"><header><img class="logo" src="icons/96.png" alt="Aion"><div><p class="eyebrow">FIRE AXOLOTL</p><h1 data-i18n="wordbook"></h1><p data-i18n="wordbookHelp"></p></div><button id="open-settings" class="secondary" data-i18n="settings"></button></header>
<main>
<section><h2 data-i18n="wordList"></h2><label><span data-i18n="wordSearch"></span><input id="word-search" type="search" autocomplete="off" maxlength="300"></label><p id="words-count" role="status" aria-live="polite"></p><p id="words-empty" data-i18n="wordbookEmpty"></p><ul id="words" class="wordbook-list" tabindex="0" data-label="wordList"></ul><nav class="row" data-label="wordPages"><button id="word-previous" class="secondary" data-i18n="wordPrevious"></button><output id="word-page"></output><button id="word-next" class="secondary" data-i18n="wordNext"></button></nav><p data-i18n="wordUndoHelp"></p><button id="word-undo" class="secondary" disabled data-i18n="wordUndo"></button></section>
<section><h2 data-i18n="wordAdd"></h2><form id="word-form"><label><span data-i18n="wordSource"></span><textarea id="word-input" rows="2" maxlength="300" required></textarea></label><button id="word-add" type="submit" data-i18n="saveWord"></button></form><p id="word-disabled" hidden data-i18n="wordAddDisabled"></p></section>
<section><h2 data-i18n="wordBackup"></h2><p data-i18n="wordBackupHelp"></p><div class="row"><button id="word-export" data-i18n="export"></button><label class="file-button"><span data-i18n="wordImportChoose"></span><input id="word-import" type="file" accept="application/json,.json" data-label="wordImportChoose"></label></div><a id="word-download" download="fire-axolotl-vocabulary.json" hidden data-i18n="wordDownload"></a><div id="word-preview" hidden><h3 data-i18n="wordImportPreview"></h3><p id="word-preview-count"></p><ul id="word-preview-list"></ul><div class="row"><button id="word-import-apply" data-i18n="wordImportMerge"></button><button id="word-import-cancel" class="secondary" data-i18n="wordImportCancel"></button></div></div><p id="word-import-result" role="status" aria-live="polite"></p></section>
<p id="status" role="status" aria-live="polite"></p>
</main><footer data-i18n="wordbookScope"></footer></body></html>
