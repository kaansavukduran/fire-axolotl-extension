<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Axolotl</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="characters.css"><script src="shared.js" defer></script><script src="characters-shared.js" defer></script><script src="character-store.js" defer></script><script src="ui.js" defer></script><script src="characters.js" defer></script></head>
<body class="characters"><header><img class="logo" src="icons/96.png" alt="Aion"><div><p class="eyebrow">FIRE AXOLOTL</p><h1 data-i18n="characterTitle"></h1></div></header>
<main>
<p data-i18n="characterScope"></p>
<section><label><span data-i18n="characterChoose"></span><select id="character"></select></label><label><span data-i18n="characterActivity"></span><select id="character-activity"></select></label>
<div class="character-stage"><canvas id="character-canvas" width="480" height="480" role="img" data-label="characterPreview"></canvas></div><div class="row"><button id="character-pause"></button><button id="character-wave" class="secondary" data-i18n="characterWave" hidden></button></div><p id="character-reduced" data-i18n="characterReduced" hidden></p><p id="character-motion-name" role="status"></p><div class="row"><button id="character-export" class="secondary" data-i18n="characterExport" hidden></button><button id="character-delete" class="secondary" data-i18n="characterDelete" hidden></button></div></section>
<section><h2 data-i18n="characterAdd"></h2><p data-i18n="characterImportHelp"></p><label><span data-i18n="characterName"></span><input id="character-name" maxlength="60" autocomplete="off"></label><label class="file-button"><span data-i18n="characterFile"></span><input id="character-file" type="file" accept="image/png,application/json,.png,.json"></label><p id="character-file-info"></p>
<details><summary data-i18n="characterGrid"></summary><p data-i18n="characterGridHelp"></p><div class="character-grid-fields"><label><span data-i18n="characterColumns"></span><input id="character-columns" type="number" min="1" max="16" value="1"></label><label><span data-i18n="characterRows"></span><input id="character-rows" type="number" min="1" max="16" value="1"></label><label><span data-i18n="characterRow"></span><input id="character-row" type="number" min="1" max="16" value="1"></label><label><span data-i18n="characterFrames"></span><input id="character-frames" type="number" min="1" max="16" value="1"></label><label><span data-i18n="characterFps"></span><input id="character-fps" type="range" min="2" max="24" step="1" value="6"><output id="character-fps-value">6</output></label></div></details><button id="character-import" data-i18n="characterImport" disabled></button></section>
<p id="status" role="status" aria-live="polite"></p>
</main></body></html>
