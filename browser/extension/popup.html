<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Axolotl · Aion</title><link rel="stylesheet" href="ui.css"><script src="shared.js" defer></script><script src="ui.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup"><header><img class="logo" src="icons/96.png" alt="Aion"><div><p class="eyebrow">FIRE AXOLOTL</p><h1 data-i18n="companion"></h1></div><button id="settings" class="quiet" data-i18n="settings"></button></header>
<main>
<p class="notice" data-i18n="extensionWelcome"></p>
<nav class="row"><button id="open-game" class="secondary" data-i18n="openGame"></button><button id="open-tabs" data-i18n="tabs"></button><button id="open-blocker" class="secondary" data-i18n="blocker"></button><button id="open-tools" class="secondary" data-i18n="tools"></button></nav>
<details data-module="characters"><summary data-i18n="characterTitle"></summary><p data-i18n="characterScope"></p><button id="open-characters" data-i18n="characterOpen"></button></details>
<section data-module="containers"><div class="section-heading"><h2 data-i18n="containers"></h2><span class="pill" data-i18n="separateCookies"></span></div><p data-i18n="containerHelp"></p>
<div class="row"><label class="grow"><span data-i18n="containerChoice"></span><select id="container"></select></label><button id="open-container" data-i18n="openContainer"></button></div>
<form id="container-form" class="row"><label class="grow"><span data-i18n="newContainer"></span><input id="container-name" maxlength="80" required autocomplete="off" data-placeholder="containerPlaceholder"></label><button type="submit" class="secondary" data-i18n="create"></button></form><button id="temporary-container" class="secondary" data-i18n="temporaryContainer"></button><p data-i18n="temporaryHelp"></p></section>
<section data-module="video"><h2 data-i18n="video"></h2><p data-i18n="videoHelp"></p><label for="speed" data-i18n="speed"></label><div class="range-row"><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"><input id="speed-number" type="number" min="0.25" max="4" step="0.05" value="1" data-label="speed"><span>×</span></div><div class="row"><button id="apply-speed" data-i18n="applyVideo"></button><button id="reset-speed" class="secondary" data-i18n="normalSpeed"></button></div>
<label class="toggle"><input id="remember-speed" type="checkbox"><span data-i18n="rememberSpeed"></span></label><button id="forget-speed" class="secondary" data-i18n="forgetSpeed"></button><p data-i18n="speedShortcuts"></p>
<label><span data-i18n="preferredQuality"></span><select id="quality"><option value="auto" data-i18n="qualityAuto"></option><option value="best" data-i18n="qualityBest"></option><option value="hd720">720p</option><option value="hd1080">1080p</option><option value="hd1440">1440p</option><option value="hd2160">4K · 2160p</option></select></label><p data-i18n="qualityHelp"></p><div class="row"><button id="apply-quality" class="secondary" data-i18n="applyQuality"></button><button id="read-resolution" class="secondary" data-i18n="readResolution"></button></div><p id="resolution" role="status"></p>
<details><summary data-i18n="dualSubtitles"></summary><p data-i18n="subtitleHelp"></p><label><span data-i18n="originalSubtitle"></span><input id="original-file" type="file" accept=".vtt,.srt,text/vtt"></label><label><span data-i18n="translatedSubtitle"></span><input id="translated-file" type="file" accept=".vtt,.srt,text/vtt"></label><div class="row"><button id="show-subtitles" data-i18n="showSubtitles"></button><button id="hide-subtitles" class="secondary" data-i18n="hideSubtitles"></button></div></details></section>
<section data-module="translation"><h2 data-i18n="translate"></h2><p data-i18n="translationHelp"></p><div class="row"><button id="read-selection" class="secondary" data-i18n="readSelection"></button><button id="read-caption" class="secondary" data-i18n="readCaption"></button></div><label><span data-i18n="sourceText"></span><textarea id="source-text" rows="3" maxlength="5000"></textarea></label><p id="provider" class="notice"></p><div class="row"><button id="translate" data-i18n="sendTranslation"></button><button id="translate-local" class="secondary" data-i18n="aiTranslate"></button></div><label><span data-i18n="translationResult"></span><textarea id="translation-result" rows="3" readonly></textarea></label><button id="save-word" class="secondary" data-i18n="saveWord"></button></section>
<section id="progress-section"><div class="section-heading"><h2 data-i18n="discovery"></h2><span id="progress-count" class="pill"></span></div><progress id="progress-bar" max="3" value="0"></progress><p data-i18n="progressHelp"></p></section>
<section data-module="ai"><h2 data-i18n="localAI"></h2><p data-i18n="aiLocalHelp"></p><button id="open-ai" data-i18n="localAI"></button></section>
<p id="status" role="status" aria-live="polite"></p>
</main><footer data-i18n="localScope"></footer></body></html>
