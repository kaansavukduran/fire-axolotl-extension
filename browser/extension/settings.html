<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Axolotl · Settings</title><link rel="stylesheet" href="ui.css"><script src="shared.js" defer></script><script src="ui.js" defer></script><script src="settings.js" defer></script></head>
<body class="settings"><header><img class="logo" src="icons/96.png" alt="Aion"><div><p class="eyebrow">FIRE AXOLOTL</p><h1 data-i18n="settings"></h1><p data-i18n="localScope"></p></div></header>
<main class="settings-grid">
<section class="wide"><h2 data-i18n="moduleLayout"></h2><p data-i18n="moduleLayoutHelp"></p><ul id="module-list" class="tab-list"></ul><button id="reset-modules" class="secondary" data-i18n="resetModules"></button></section>
<section><h2 data-i18n="language"></h2><label><span data-i18n="interfaceLanguage"></span><select id="language" data-setting="language"><option value="" data-i18n="deviceLanguage"></option><option value="tr">Türkçe</option><option value="en">English</option></select></label><p data-i18n="languageScope"></p></section>
<section class="wide"><h2 data-i18n="appearance"></h2>
<label class="toggle"><input type="checkbox" data-setting="browserTheme"><span data-i18n="browserTheme"></span></label>
<label class="toggle"><input type="checkbox" data-setting="runner"><span data-i18n="enableRunner"></span></label>
<button id="reset-runner" class="secondary" data-i18n="resetRunner"></button><label><span data-i18n="theme"></span><select id="theme" data-setting="theme"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option><option value="contrast" data-i18n="contrast"></option></select></label>
<label for="scale" data-i18n="scale"></label><div class="range-row"><input id="scale" type="range" min="80" max="200" step="5" data-setting="scale"><input id="scale-number" type="number" min="80" max="200" step="1" data-label="scale"><span>%</span><button id="reset-scale" class="secondary" data-i18n="reset"></button></div><div id="scale-presets" class="presets"><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="125">125%</button><button data-scale="150">150%</button><button data-scale="175">175%</button><button data-scale="200">200%</button></div>
<label for="textSize" data-i18n="textSize"></label><div class="range-row"><input id="textSize" type="range" min="80" max="200" step="5" data-setting="textSize"><input id="textSize-number" type="number" min="80" max="200" step="1" data-label="textSize"><span>%</span><button id="reset-text" class="secondary" data-i18n="reset"></button></div>
<label><span data-i18n="font"></span><select id="font" data-setting="font"><option value="system" data-i18n="systemFont"></option><option value="sans">Arial / Helvetica</option><option value="serif">Georgia</option><option value="dyslexic">Lexend</option><option value="opendyslexic">OpenDyslexic</option></select></label><p data-i18n="fontHelp"></p>
<details><summary data-i18n="advanced"></summary><label for="lineHeight" data-i18n="lineHeight"></label><div class="range-row"><input id="lineHeight" type="range" min="1" max="2.5" step="0.1" data-setting="lineHeight"><output id="lineHeight-value"></output><span>×</span></div><label for="letterSpacing" data-i18n="letterSpacing"></label><div class="range-row"><input id="letterSpacing" type="range" min="0" max="0.2" step="0.01" data-setting="letterSpacing"><output id="letterSpacing-value"></output><span>em</span></div></details>
<div class="preview"><strong data-i18n="preview"></strong><p data-i18n="previewText"></p><button class="secondary" disabled data-i18n="previewButton"></button></div><p data-i18n="appearanceScope"></p></section>
<section><h2 data-i18n="translationSettings"></h2><p data-i18n="nativeTranslation"></p><label><span data-i18n="targetLanguage"></span><select id="targetLanguage" data-setting="targetLanguage"><option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ar">العربية</option></select></label><label><span data-i18n="endpoint"></span><input id="endpoint" type="url" placeholder="https://translate.example.org/translate" autocomplete="off"></label><p data-i18n="endpointHelp"></p><div class="row"><button id="save-endpoint" data-i18n="saveEndpoint"></button><button id="revoke-endpoint" class="secondary" data-i18n="revokeEndpoint"></button></div></section>
<section><h2 data-i18n="discovery"></h2><label class="toggle"><input type="checkbox" id="progress" data-setting="progress"><span data-i18n="enableProgress"></span></label><p data-i18n="progressHelp"></p><label class="toggle"><input type="checkbox" id="animations" data-setting="animations"><span data-i18n="animations"></span></label><p data-i18n="silentFeedback"></p><button id="reset-progress" class="secondary" data-i18n="resetProgress"></button></section>
<section><h2 data-i18n="data"></h2><p data-i18n="dataHelp"></p><div class="row"><button id="export" data-i18n="export"></button><label class="file-button"><span data-i18n="import"></span><input id="import" type="file" accept="application/json,.json"></label></div><p id="word-count"></p><details><summary data-i18n="wordList"></summary><ul id="word-list"></ul></details></section>
<section><h2 data-i18n="updates"></h2><p><span data-i18n="installedVersion"></span> <strong id="version"></strong></p><p data-i18n="updateHelp"></p><button id="check-updates" data-i18n="checkUpdates"></button><p id="update-result" role="status"></p><pre id="release-notes"></pre><a id="release-link" href="https://github.com/kaansavukduran/fire-axolotl-extension/releases" target="_blank" rel="noopener noreferrer" data-i18n="releases"></a></section>
<section><h2 data-i18n="imageSearch"></h2><label class="toggle"><input type="checkbox" id="imageSearch" data-setting="imageSearch"><span data-i18n="enableImageSearch"></span></label><p data-i18n="imageSearchHelp"></p></section>
<section><h2 data-i18n="characterTitle"></h2><p data-i18n="characterScope"></p><button id="open-characters" data-i18n="characterOpen"></button></section>
<section><h2 data-i18n="blocker"></h2><p data-i18n="blockerHelp"></p><button id="open-blocker" data-i18n="openBlocker"></button></section>
<section><h2 data-i18n="tools"></h2><button id="open-tools" data-i18n="openTools"></button></section>
<section><h2 data-i18n="localAI"></h2><p data-i18n="aiLocalHelp"></p><button id="open-ai" data-i18n="localAI"></button></section>
<section><h2 data-i18n="firefoxControls"></h2><p data-i18n="firefoxControlsHelp"></p><button id="open-firefox" data-i18n="openFirefoxSettings"></button></section>
<section class="wide"><h2 data-i18n="settingsSync"></h2><p data-i18n="syncScope"></p><label class="toggle"><input id="sync-enabled" type="checkbox"><span data-i18n="syncEnable"></span></label><div class="row"><button id="sync-push" data-i18n="syncPush"></button><button id="sync-pull" class="secondary" data-i18n="syncPull"></button><button id="firefox-sync" class="secondary" data-i18n="openFirefoxSync"></button></div></section>
<p id="status" class="wide" role="status" aria-live="polite"></p>
</main><footer><span data-i18n="securityNote"></span></footer></body></html>
