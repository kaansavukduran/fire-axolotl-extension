name: Single extension checks and real Firefox
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r tests/requirements-gecko.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:ai
      - run: python3 scripts/fetch_ai_support.py
      - run: npm test
      - run: python3 scripts/package_extension.py --with-sources
      - run: python3 scripts/package_extension.py --native-newtab
      - run: npm run check
      - run: python3 scripts/fetch_test_runtime.py
      - run: python3 tests/gecko_e2e.py
      - run: python3 tests/native_newtab_e2e.py
      - run: python3 tests/tab_manager_e2e.py
      - run: python3 tests/page_translation_e2e.py
      - run: python3 tests/caption_learning_e2e.py
      - run: python3 tests/bergamot_e2e.py
      - run: python3 tests/caption_card_e2e.py
      - run: python3 tests/wordbook_e2e.py
      - run: python3 tests/usability_e2e.py
      - name: Local HTTPS fixture certificate tools
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - run: python3 tests/youtube_e2e.py
      - run: python3 scripts/fetch_previous_preview.py
      - name: Preserve settings and blocker data on temporary developer upgrade
        env:
          AION_PREVIOUS_XPI: ${{ github.workspace }}/work/previous-preview-0.1.0.xpi
        run: python3 tests/upgrade_e2e.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: single-extension-preview-and-evidence
          path: |
            dist/
            work/test-artifacts/
            work/native-newtab-test-artifacts/
            work/upgrade-test-artifacts/
            work/tab-manager-test-artifacts/
            work/page-translation-test-artifacts/
            work/caption-learning-test-artifacts/
            work/bergamot-test-artifacts/
            work/caption-card-test-artifacts/
            work/wordbook-test-artifacts/
            work/usability-test-artifacts/
            work/youtube-test-artifacts/
            work/bergamot-support/
            work/components/*corresponding-source.tar.gz
            work/ai-support/
          retention-days: 30
